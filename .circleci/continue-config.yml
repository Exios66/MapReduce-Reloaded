# Continuation config for the CircleCI setup workflow (docs/ci.md, ADR 0020).
# .circleci/config.yml (setup: true) decides which pipeline parameters are
# true from the PR's changed files, then continues here.
#
# There is deliberately NO aggregator/gate job: a job that CircleCI skips
# with `when` does not satisfy another job's `requires`, so a gate requiring
# skipped jobs would never run. Instead every job always exists in the
# workflow, so every required check always reports, and skipping happens
# inside each job with `when`/`unless` wrapper steps: the skip note runs
# inside `unless` (only when the job is unimplicated) and all real steps run
# inside `when`, so a skipped job reports SUCCESS after seconds, without a
# checkout or any install. (A `when` key on an individual step is not a
# logic condition in CircleCI — it is an outcome enum — which is why the
# gating uses wrapper steps.) A skipped job is sound because a job's result
# is a function of its inputs: if none of them changed, the result from
# main stands.
#
# On main itself nothing is skipped: every condition also holds when the
# branch is main, so each push to main runs the full suite. Filtering saves
# credits on PR pushes only, and main keeps full coverage.
#
# The four original jobs keep their exact make targets. The `lint` job holds
# `md-lint`, which used to run inside the Python jobs, and
# `mapping-coverage` always runs and fails the pipeline if any changed file
# matches no line of .circleci/mapping.txt.
#
# Required checks (docs/ci.md): proto, go, python-3.11, python-3.13, lint,
# mapping-coverage.
version: 2.1

parameters:
  run-all:
    type: boolean
    default: false
  run-proto:
    type: boolean
    default: false
  run-go:
    type: boolean
    default: false
  run-python:
    type: boolean
    default: false
  run-lint:
    type: boolean
    default: false
  run-go-python:
    type: boolean
    default: false
  run-go-docs:
    type: boolean
    default: false
  run-sh-lint:
    type: boolean
    default: false

# Docker executors only, on the Free plan. Python jobs are small; the Go and
# protobuf jobs compile and run the race detector, so they are medium.
# cimg/python includes the C compiler that `go test -race` (cgo) needs.
executors:
  small:
    parameters:
      python:
        type: string
    docker:
      - image: cimg/python:<< parameters.python >>
    resource_class: small
  medium:
    parameters:
      python:
        type: string
    docker:
      - image: cimg/python:<< parameters.python >>
    resource_class: medium
    environment:
      CGO_ENABLED: "1"
      # Fail instead of silently downloading another Go release: the toolchain
      # is the one scripts/ci-install-go.sh installed from go/go.mod.
      GOTOOLCHAIN: local

commands:
  # Installs python[dev]. The cache holds pip's downloads only: the install
  # always runs, so a restored cache cannot stand in for it.
  python-deps:
    parameters:
      python:
        type: string
    steps:
      - restore_cache:
          keys:
            - pip-v1-{{ arch }}-py<< parameters.python >>-{{ checksum "python/pyproject.toml" }}
            - pip-v1-{{ arch }}-py<< parameters.python >>-
      - run:
          name: Install python[dev]
          command: python -m pip install -e "python[dev]"
      - save_cache:
          key: pip-v1-{{ arch }}-py<< parameters.python >>-{{ checksum "python/pyproject.toml" }}
          paths:
            - ~/.cache/pip

  # Puts the Go release named by go/go.mod on the PATH. The script verifies the
  # SHA-256 of a fresh download, and reuses a cached directory only if it
  # reports exactly that version.
  go-toolchain:
    steps:
      - run:
          name: Read the Go version from go/go.mod
          command: scripts/ci-install-go.sh --version | tee /tmp/go-version
      - restore_cache:
          keys:
            - go-toolchain-v1-{{ arch }}-{{ checksum "/tmp/go-version" }}
      - run:
          name: Install Go
          command: |
            bin=$(scripts/ci-install-go.sh)
            echo "export PATH=\"$bin:\$HOME/go/bin:\$PWD/.tools/bin:\$HOME/.cache/golangci-bin:\$PATH\"" >> "$BASH_ENV"
            "$bin/go" version
      - save_cache:
          key: go-toolchain-v1-{{ arch }}-{{ checksum "/tmp/go-version" }}
          paths:
            - ~/.cache/go-toolchain
      - restore_cache:
          keys:
            - go-mod-v1-{{ arch }}-{{ checksum "go/go.sum" }}
            - go-mod-v1-{{ arch }}-
      - run:
          name: Download Go modules
          command: cd go && go mod download
      - save_cache:
          key: go-mod-v1-{{ arch }}-{{ checksum "go/go.sum" }}
          paths:
            - ~/go/pkg/mod

  # The code generators pinned in the Makefile. `make tools` always runs:
  # scripts/install-tool.sh keeps a cached binary only if `go version -m`
  # shows it was built from the pin, and go installs any other.
  proto-tools:
    steps:
      - run:
          name: Read the generator pins
          command: grep -h '@v' Makefile | cat - /tmp/go-version > /tmp/tool-pins
      - restore_cache:
          keys:
            - proto-tools-v1-{{ arch }}-{{ checksum "/tmp/tool-pins" }}
      - run:
          name: Install the generators
          # Some pins need a newer Go than go.mod's (buf v1.74.0 needs
          # 1.26.7); as in scripts/vm-setup.sh, the go command fetches that
          # toolchain itself, checked against the Go checksum database. Lint
          # and tests still run on the toolchain installed above.
          environment:
            GOTOOLCHAIN: auto
          command: make tools
      - save_cache:
          key: proto-tools-v1-{{ arch }}-{{ checksum "/tmp/tool-pins" }}
          paths:
            - .tools/bin

  # golangci-lint, built by the Go toolchain above at the version pinned in
  # scripts/vm-setup.sh. A cached binary is kept only if it reports that
  # version and was built by this Go release; otherwise it is rebuilt.
  golangci-lint:
    steps:
      - run:
          name: Read the golangci-lint pin
          command: |
            sed -n 's/^GOLANGCI_VERSION=//p' scripts/vm-setup.sh > /tmp/golangci-version
            test -s /tmp/golangci-version
            cat /tmp/golangci-version /tmp/go-version > /tmp/golangci-pins
      - restore_cache:
          keys:
            - golangci-v1-{{ arch }}-{{ checksum "/tmp/golangci-pins" }}
      - run:
          name: Install golangci-lint
          command: |
            want=$(cat /tmp/golangci-version)
            have=$(golangci-lint version 2>&1 || true)
            if ! { echo "$have" | grep -qF "${want#v}" && echo "$have" | grep -qF "built with $(go env GOVERSION)"; }; then
              GOBIN=$HOME/.cache/golangci-bin go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@$want"
            fi
            golangci-lint version
      - save_cache:
          key: golangci-v1-{{ arch }}-{{ checksum "/tmp/golangci-pins" }}
          paths:
            - ~/.cache/golangci-bin

  # Go's build cache (compiled packages, including the race-instrumented
  # standard library) and golangci-lint's analysis cache. Both are keyed by
  # content, so a restored entry is only ever reused for identical input; the
  # job's GOFLAGS=-count=1 keeps test results out of it. The key changes with
  # the Go release, go.sum and the ISO week, so the cache is refreshed weekly
  # and is saved once per key, not on every run. Each of the go job's nodes
  # builds different things (race, coverage, lint), so each keeps its own
  # cache; a new week starts from the node's last one.
  go-build-cache-restore:
    steps:
      - run:
          name: Key the Go build cache
          command: |
            { cat /tmp/go-version; date -u +%G-%V; } > /tmp/go-build-key
            echo "GOCACHE=$(go env GOCACHE)"
      - restore_cache:
          keys:
            - go-build-v2-{{ arch }}-node{{ .Environment.CIRCLE_NODE_INDEX }}-{{ checksum "/tmp/go-build-key" }}-{{ checksum "go/go.sum" }}
            - go-build-v2-{{ arch }}-node{{ .Environment.CIRCLE_NODE_INDEX }}-{{ checksum "/tmp/go-build-key" }}-
            - go-build-v2-{{ arch }}-node{{ .Environment.CIRCLE_NODE_INDEX }}-

  # gotestsum runs `go test` and writes JUnit XML when JUNIT_DIR is set
  # (Makefile). v1.12.0's x/tools v0.19.0 does not build on the pinned Go
  # 1.26 (`invalid array length -delta * delta`); v1.13.0 does.
  gotestsum:
    steps:
      - run:
          name: Install gotestsum
          command: go install gotest.tools/gotestsum@v1.13.0

  go-build-cache-save:
    steps:
      - save_cache:
          key: go-build-v2-{{ arch }}-node{{ .Environment.CIRCLE_NODE_INDEX }}-{{ checksum "/tmp/go-build-key" }}-{{ checksum "go/go.sum" }}
          paths:
            - ~/.cache/go-build
            - ~/.cache/golangci-lint

jobs:
  # Generated-code freshness and protobuf compatibility against a freshly
  # fetched origin/main. A failed fetch fails the job: the compatibility
  # check is never skipped.
  proto:
    executor:
      name: medium
      python: "3.13"
    steps:
      - unless:
          condition:
            or:
              - << pipeline.parameters.run-all >>
              - equal: [main, << pipeline.git.branch >>]
              - << pipeline.parameters.run-proto >>
          steps:
            - run:
                name: Not implicated — skipping
                command: 'echo "proto: no proto, build, or CI files changed; the proto result from main stands (docs/ci.md)."'
      - when:
          condition:
            or:
              - << pipeline.parameters.run-all >>
              - equal: [main, << pipeline.git.branch >>]
              - << pipeline.parameters.run-proto >>
          steps:
            # A full clone: buf breaking clones this repository to read main, and
            # the default blobless checkout lacks objects that clone needs.
            - checkout:
                method: full
            - go-toolchain
            - python-deps:
                python: "3.13"
            - proto-tools
            - run:
                name: Fetch origin/main
                # The checkout's remote needs the project's deploy key. A fork's
                # build has none, so fall back to the public HTTPS URL.
                command: |
                  git fetch --quiet origin +refs/heads/main:refs/remotes/origin/main ||
                    git fetch --quiet "https://github.com/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}.git" +refs/heads/main:refs/remotes/origin/main
            - run:
                name: make proto-check
                command: make proto-check PYTHON=python PROTO_FETCH=false

  # Formatting, vet, golangci-lint, then the race-detector tests, the paper
  # mapping check and the coverage floors. python[dev] is installed here too:
  # the Go golden tests run the Python reference implementation, and
  # py-e2e runs the Python coordinator with the Go commands, which the
  # Python jobs, without Go, skip.
  #
  # A change to python/ alone runs the narrow mode, make go-python-test
  # py-e2e: only cmd/mr (its golden tests compare with Python's output),
  # papermap (it reads the Python test names) and py-e2e read python/.
  # Every other Go package passes with python/ deleted and no Python on the
  # PATH, so their result from main stands (docs/ci.md).
  #
  # The narrow mode has two more parts (ADR 0025). A change to README.md or
  # docs/paper-mapping.md alone (run-go-docs) runs make go-python-test: only
  # cmd/mr reads the README and only papermap reads the mapping table. A
  # change to shell scripts or the git hook alone (run-sh-lint) runs make
  # sh-lint, which needs neither Go nor Python, so that part installs
  # neither. scripts/ci-go-job.sh reads the parts from MR_CI_GO_NARROW.
  #
  # The job runs on three nodes at once (ADR 0024): CircleCI reports them as
  # the one go check, which passes only if every node passes.
  # scripts/ci-go-job.sh gives each node its part of the same make targets:
  # the race tests, the coverage tests, and sh-lint, go-lint and py-e2e.
  # Every node sets up the same toolchain, so the parts are independent.
  go:
    executor:
      name: medium
      python: "3.13"
    parallelism: 3
    environment:
      # The build cache is restored, but test results never are: every test
      # runs on every run, as on a fresh machine.
      GOFLAGS: -count=1
    steps:
      - unless:
          condition:
            or:
              - << pipeline.parameters.run-all >>
              - equal: [main, << pipeline.git.branch >>]
              - << pipeline.parameters.run-go >>
              - << pipeline.parameters.run-go-python >>
              - << pipeline.parameters.run-go-docs >>
              - << pipeline.parameters.run-sh-lint >>
          steps:
            - run:
                name: Not implicated — skipping
                command: 'echo "go: no Go, Python (py-e2e), shell, build, or CI files changed; the go result from main stands (docs/ci.md)."'
      # The narrow mode with a part that runs Go tests (python or docs).
      - when:
          condition:
            and:
              - or:
                  - << pipeline.parameters.run-go-python >>
                  - << pipeline.parameters.run-go-docs >>
              - not:
                  or:
                    - << pipeline.parameters.run-all >>
                    - equal: [main, << pipeline.git.branch >>]
                    - << pipeline.parameters.run-go >>
          steps:
            - checkout
            - go-toolchain
            - python-deps:
                python: "3.13"
            - go-build-cache-restore
            - gotestsum
            - run:
                name: The narrow mode's parts (go-python-test, py-e2e, sh-lint), this node's share
                environment:
                  MR_CI_GO_NARROW: "python=<< pipeline.parameters.run-go-python >> docs=<< pipeline.parameters.run-go-docs >> sh=<< pipeline.parameters.run-sh-lint >>"
                  JUNIT_DIR: /tmp/test-results
                command: scripts/ci-go-job.sh narrow
                no_output_timeout: 30m
            - store_test_results:
                path: /tmp/test-results
                when: always
            - store_artifacts:
                path: /tmp/test-results
                destination: test-results
                when: always
      # The narrow mode with sh-lint alone, which needs neither Go nor Python.
      - when:
          condition:
            and:
              - << pipeline.parameters.run-sh-lint >>
              - not:
                  or:
                    - << pipeline.parameters.run-all >>
                    - equal: [main, << pipeline.git.branch >>]
                    - << pipeline.parameters.run-go >>
                    - << pipeline.parameters.run-go-python >>
                    - << pipeline.parameters.run-go-docs >>
          steps:
            - checkout
            - run:
                name: make sh-lint (only shell scripts changed), on this job's last node
                environment:
                  MR_CI_GO_NARROW: "python=false docs=false sh=true"
                command: scripts/ci-go-job.sh narrow
      - when:
          condition:
            or:
              - << pipeline.parameters.run-all >>
              - equal: [main, << pipeline.git.branch >>]
              - << pipeline.parameters.run-go >>
          steps:
            - checkout
            - go-toolchain
            - python-deps:
                python: "3.13"
            - go-build-cache-restore
            - golangci-lint
            - gotestsum
            # Node 2 installs shellcheck (scripts/vm-setup.sh --shellcheck)
            # and runs sh-lint with MR_REQUIRE_SHELLCHECK=1, so a missing
            # shellcheck fails the job.
            - run:
                name: make sh-lint go-lint go-test py-e2e, this node's part
                environment:
                  JUNIT_DIR: /tmp/test-results
                command: scripts/ci-go-job.sh full
                no_output_timeout: 30m
            - go-build-cache-save
            - store_test_results:
                path: /tmp/test-results
                when: always
            - store_artifacts:
                path: /tmp/test-results
                destination: test-results
                when: always
            - store_artifacts:
                path: go/cover.out

  # Ruff formatting and lint, the Python tests and the coverage floors, once
  # per supported version. md-lint moved to the lint job: it used to run
  # here, which forced the full Python suite on docs-only PRs.
  python:
    parameters:
      version:
        type: string
    executor:
      name: small
      python: << parameters.version >>
    steps:
      - unless:
          condition:
            or:
              - << pipeline.parameters.run-all >>
              - equal: [main, << pipeline.git.branch >>]
              - << pipeline.parameters.run-python >>
          steps:
            - run:
                name: Not implicated — skipping
                command: 'echo "python: no Python, build, or CI files changed; the python result from main stands (docs/ci.md)."'
      - when:
          condition:
            or:
              - << pipeline.parameters.run-all >>
              - equal: [main, << pipeline.git.branch >>]
              - << pipeline.parameters.run-python >>
          steps:
            - checkout
            - python-deps:
                python: << parameters.version >>
            - run:
                name: make py-lint py-test
                environment:
                  JUNIT_DIR: /tmp/test-results
                command: make py-lint py-test PYTHON=python
            - store_test_results:
                path: /tmp/test-results
                when: always
            - store_artifacts:
                path: /tmp/test-results
                destination: test-results
                when: always
            - store_artifacts:
                path: python/cover.json

  # Markdown link and style checks (check-links.py + pymarkdown), and the
  # documentation tests in docs/tests, which compare the guides with the
  # configuration they describe (make docs-test, ADR 0025). Runs on any PR
  # that touches Markdown or docs-adjacent files, and on every run-all PR.
  # It installs only pymarkdown, pytest and PyYAML, at python[dev]'s
  # versions, not the full python[dev] set: check-links.py needs the
  # standard library only, and the documentation tests import no package.
  lint:
    executor:
      name: small
      python: "3.11"
    steps:
      - unless:
          condition:
            or:
              - << pipeline.parameters.run-all >>
              - equal: [main, << pipeline.git.branch >>]
              - << pipeline.parameters.run-lint >>
          steps:
            - run:
                name: Not implicated — skipping
                command: 'echo "lint: no Markdown, docs, bench, examples, deploy, template, or build files changed; the lint result from main stands (docs/ci.md)."'
      - when:
          condition:
            or:
              - << pipeline.parameters.run-all >>
              - equal: [main, << pipeline.git.branch >>]
              - << pipeline.parameters.run-lint >>
          steps:
            - checkout
            - run:
                name: Install pymarkdown, pytest and PyYAML
                command: python -m pip install "pymarkdownlnt==0.9.41" "pytest>=8" "PyYAML>=6"
            - run:
                name: make md-lint docs-test
                command: make md-lint docs-test PYTHON=python

  # Always runs, with no `when` gating: it re-runs the selection and fails
  # the pipeline if any file the PR changes matches no line of
  # .circleci/mapping.txt, or if the parameters this pipeline received lack
  # one the selection sets, so a job can never be skipped silently.
  mapping-coverage:
    executor:
      name: small
      python: "3.11"
    environment:
      MR_CI_PARAMS: '{"run-all": << pipeline.parameters.run-all >>, "run-go": << pipeline.parameters.run-go >>, "run-python": << pipeline.parameters.run-python >>, "run-proto": << pipeline.parameters.run-proto >>, "run-lint": << pipeline.parameters.run-lint >>, "run-go-python": << pipeline.parameters.run-go-python >>, "run-go-docs": << pipeline.parameters.run-go-docs >>, "run-sh-lint": << pipeline.parameters.run-sh-lint >>}'
    steps:
      - checkout
      - run:
          name: Check the job selection
          command: python3 scripts/ci-params.py --check

# Jobs run in parallel, each in its own checkout, so proto generation cannot
# change files another job is testing. All six jobs always exist in the
# workflow, so all six checks always report (docs/ci.md); skipping happens
# inside the jobs, not by removing them.
workflows:
  ci:
    jobs:
      - proto
      - go
      - python:
          name: python-3.11
          version: "3.11"
      - python:
          name: python-3.13
          version: "3.13"
      - lint
      - mapping-coverage
