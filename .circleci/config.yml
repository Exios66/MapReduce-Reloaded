# Hosted CI on CircleCI's Free plan (docs/ci.md, ADR 0014, ADR 0020).
# This file is the SETUP config only: it decides which jobs run, from the
# files the PR changes, and then continues with .circleci/continue-config.yml.
# It holds no test logic.
#
# The select job runs scripts/ci-params.py, which reads
# .circleci/mapping.txt and prints the pipeline parameters, and continues
# with them. A docs-only PR then costs this job, lint, mapping-coverage and
# four echo-only jobs instead of the full suite. Nothing is dropped: a job
# is skipped only when none of its inputs changed, a deleted or unmapped
# file runs everything, and the mapping-coverage job re-runs the selection
# and fails if a file is unmapped or the jobs received other parameters.
#
# The selection is our own script, not the path-filtering orb: the orb's
# diff lists a moved file only at its new path, so moving a file out of a
# job's directory skipped that job, and it cannot see deletions. The
# script needs only the image's python3 and git; the continuation orb
# posts its output to CircleCI.
#
# A push to main runs no CI jobs (ADR 0021): branch protection merges only
# a PR whose six checks passed on a branch up to date with main, so main's
# new commit was already tested. On main the select job only finishes the
# pipeline, continuing with an empty config (the orb's finish command sends
# "version: 2", which CircleCI now rejects).
version: 2.1
setup: true
orbs:
  continuation: circleci/continuation@1.0.0
jobs:
  select:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - unless:
          condition:
            equal: [main, << pipeline.git.branch >>]
          steps:
            - checkout
            - run:
                name: Select the implicated jobs
                command: python3 scripts/ci-params.py | tee /tmp/ci-params.json
            - continuation/continue:
                configuration_path: .circleci/continue-config.yml
                parameters: /tmp/ci-params.json
      - when:
          condition:
            equal: [main, << pipeline.git.branch >>]
          steps:
            - checkout
            - continuation/continue:
                configuration_path: .circleci/empty-continue-config.yml
workflows:
  setup:
    jobs:
      - select
