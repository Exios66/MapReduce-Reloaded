# Hosted CI on CircleCI's Free plan (docs/ci.md, ADR 0014, ADR 0019).
# This file is the SETUP config only: it decides which jobs run, from the
# files the PR changes, and then continues with .circleci/continue-config.yml.
# It holds no job definitions and no test logic.
#
# A setup workflow costs one small job per push; the jobs it skips are the
# medium/small test jobs, so a docs-only PR costs the setup job, the lint
# job, the mapping-coverage job and four echo-only jobs instead of the full
# suite. Nothing is dropped: a job is skipped only when none of its inputs
# changed, and scripts/check-ci-mapping.py fails the pipeline if any changed
# file matches no mapping pattern below. Keep this mapping and that script
# in sync: the script parses this block, so each line must stay in the form
# `<regex> <parameter> true`, with no comments inside the block.
version: 2.1
setup: true
orbs:
  path-filtering: circleci/path-filtering@1.1.0
workflows:
  setup:
    jobs:
      - path-filtering/filter:
          base-revision: main
          config-path: .circleci/continue-config.yml
          mapping: |
            ^\.circleci/.* run-all true
            ^Makefile$ run-all true
            ^python/pyproject\.toml$ run-all true
            ^scripts/.* run-all true
            ^bin/.* run-all true
            ^go/go\.mod$ run-all true
            ^go/.* run-go true
            ^python/.* run-python true
            ^python/.* run-go true
            ^proto/.* run-proto true
            ^.*\.sh$ run-go true
            ^.*\.md$ run-lint true
            ^docs/.* run-lint true
            ^bench/.* run-lint true
            ^examples/.* run-lint true
            ^deploy/.* run-lint true
            ^\.github/.* run-lint true
            ^LICENSE.* run-lint true
            ^\.[^/]*$ run-lint true
