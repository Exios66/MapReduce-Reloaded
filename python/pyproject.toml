[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mapreduce-reloaded"
version = "0.0.1"
description = "A modern re-implementation of Google's 2004 MapReduce (Python reference implementation)."
requires-python = ">=3.11"
dependencies = [
    # Versions match the generator in scripts/gen-proto.sh; generated code
    # refuses to load with an older runtime.
    "grpcio>=1.84.1",
    "protobuf>=7.35.1",
]

[project.optional-dependencies]
# Block compression for MRKV codecs 1 (zstd) and 2 (snappy); codec 0 needs neither.
compression = ["zstandard>=0.25", "python-snappy>=0.7"]
dev = [
    "PyYAML>=6",
    "pytest>=8",
    "hypothesis>=6",
    "coverage>=7",
    "ruff>=0.5",
    "grpcio-tools==1.84.1",
    "zstandard>=0.25",
    "python-snappy>=0.7",
]
# Run the demo notebook: examples/demo.ipynb
notebook = ["nbconvert>=7", "ipykernel>=6"]
# make mutate-py
mutation = ["mutmut>=3.8"]

[tool.setuptools.packages.find]
include = ["mapreduce_reloaded*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["mapreduce_reloaded/gen"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.coverage.run]
source = ["mapreduce_reloaded"]
omit = ["*/gen/*"]  # generated by protoc
data_file = ".coverage"

[tool.mutmut]
# make mutate-py. The tests run in a copy under mutants/, so they find
# testdata/ by searching upward rather than at a fixed depth.
paths_to_mutate = ["mapreduce_reloaded/formats/kv.py", "mapreduce_reloaded/partition/hash.py"]
also_copy = ["mapreduce_reloaded"]
tests_dir = [
    "tests/test_kv.py",
    "tests/test_kv_boundaries.py",
    "tests/test_edges.py",
    "tests/test_formats.py",
    "tests/test_format_vectors.py",
    "tests/test_partition_hash.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
