name: CI

# Runs the same checks as `make check` on every pull request and on main, so
# a reviewer sees the result on the PR (see docs/design/0014-ci-on-pull-requests.md).
# The repository variable CI_RUNNER picks the runner (ADR 0014).
# The pre-push hook still runs `make check` locally before each push.
# CircleCI runs the same checks independently of Actions (docs/ci.md); this
# workflow is the fallback while the account's billing lock lasts.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proto:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # fetch origin/main while checkout still has credentials
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e "python[dev]"
      - run: make tools
      # Use checkout's fresh origin/main without another authenticated fetch.
      - run: make proto-check PYTHON=python PROTO_FETCH=false

  go:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
      # The Go golden tests run the Python reference implementation.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e "python[dev]"
      # Built from source so it is built with the module's Go version. Keep the
      # version in step with .circleci/config.yml and scripts/vm-setup.sh.
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
      - run: make go-lint go-test PYTHON=python

  python:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e "python[dev]"
      - run: make py-lint py-test PYTHON=python
