name: CI

# Automatic runs are disabled: the quality gate is `make check`, run locally
# by the pre-push hook (see docs/design/0002-local-quality-gate.md).
# This workflow can still be started by hand from the Actions tab.
on:
  workflow_dispatch:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
      - uses: golangci/golangci-lint-action@v6
        with:
          working-directory: go
      - run: make go-test

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e "python[dev]"
      - run: make py-lint py-test
