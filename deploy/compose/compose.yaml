# The cluster on one machine (docs/cluster-vm.md): one coordinator and four
# workers, each worker limited to one CPU so that a job is fastest when its
# tasks are spread over all four (the VM has 4 vCPUs). `make cluster-up` starts it, `make e2e` runs word count on it and
# `make cluster-down` removes it. `make monitoring-up` adds Prometheus and
# Grafana with a dashboard of the cluster's metrics, and `make e2e-s3` runs
# the same job against an S3 store in the s3 profile.
#
# Every container sees the host's data/ directory at /data, the shared
# storage that bin/mr upload and bin/mr cat reach from the host (ADR 0016);
# make cluster-up creates it. The test corpus is also at /corpus, and the
# output volume at /out holds the experiments' inputs and output and the
# write-ahead log. Job specs carry absolute paths. Map output stays inside each worker and is
# fetched over the network (§3.1 step 5); a worker deletes a job's map output
# once the job ends, and takes no task while under 1 GiB of disk is free.
#
# Every container's log rotates at 10 MB, three files kept. Prometheus has
# a 512 MB retention target, not a hard disk-usage limit: WAL and head chunks
# may temporarily exceed it. Reserve additional free space for monitoring.
# Job output in the output volume stays until removed (docs/runbook.md).
name: mapreduce

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-node: &node
  image: mapreduce-reloaded
  logging: *logging
  environment: # used only for s3:// names
    AWS_ENDPOINT_URL: http://s3:9000
    AWS_REGION: us-east-1
    AWS_ACCESS_KEY_ID: mapreduce
    AWS_SECRET_ACCESS_KEY: mapreduce-secret
  volumes:
    - ../../data:/data
    - ../../testdata/corpus:/corpus:ro
    - output:/out

services:
  coordinator:
    <<: *node
    build:
      context: ../../go
      dockerfile: ../deploy/docker/Dockerfile
    command: [coordinator, -addr, ":7070", -http, ":8080"]
    ports:
      - "127.0.0.1:18770:7070"
      - "127.0.0.1:18780:8080" # status page and /metrics
    mem_limit: 256m

  worker:
    <<: *node
    command: [worker, -coordinator, "coordinator:7070", -http, ":8081"] # /metrics inside the network
    mem_limit: 768m
    cpus: 1
    deploy:
      replicas: 4
    depends_on: [coordinator]

  # Runs one mr command: docker compose run --rm mr submit ...
  mr:
    <<: *node
    entrypoint: [mr]
    profiles: [tools]
    mem_limit: 128m

  # The s3 profile: an S3-compatible store (#41, ADR 0013). Each directory in
  # /data is a bucket: s3://corpus holds the test corpus, and s3://out the
  # job output.
  s3:
    image: versity/versitygw:v1.9.0
    profiles: [s3]
    logging: *logging
    command: [--port, ":9000", posix, /data]
    environment:
      ROOT_ACCESS_KEY: mapreduce
      ROOT_SECRET_KEY: mapreduce-secret
    volumes:
      - ../../testdata/corpus:/data/corpus:ro
      - s3-output:/data/out
    # Ready once the port accepts connections; make e2e-s3 waits for it.
    healthcheck:
      test: [CMD, nc, -w, "1", 127.0.0.1, "9000"]
      interval: 1s
      retries: 30
    mem_limit: 256m

  # The monitoring profile: Prometheus scrapes the coordinator and every
  # worker, and Grafana shows them (docs/explainers/24-status.md).
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [monitoring]
    logging: *logging
    command: # the image's defaults, plus a cap on stored samples
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.size=512MB
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:19090:9090"
    mem_limit: 256m

  grafana:
    image: grafana/grafana:12.1.0
    profiles: [monitoring]
    logging: *logging
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true" # read-only, and bound to localhost
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:13000:3000"
    mem_limit: 256m
    depends_on: [prometheus]

volumes:
  output:
  s3-output:
